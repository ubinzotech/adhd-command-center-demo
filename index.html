<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD Command Center — Shop by Wrenly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FAF6EF; --card:#FFFDF9; --border:#E8DCC8; --tint:#F3EBDD;
  --accent:#7A84C8; --accent-soft:#E0E4F2; --accent-deep:#5A63A8;
  --head:#2B2620; --body:#5C5548; --muted:#8A7F6A;
  --gold:#C9A227; --green:#5E8C5A; --red:#C05A44; --teal:#0CA9B5;
  --input:#FFFFFF; --shadow:rgba(43,38,32,.08);
}
/* ---- Dark mode: warm dark palette ---- */
[data-theme="dark"]{
  --bg:#211C16; --card:#2C2620; --border:#453D31; --tint:#362E25;
  --head:#F2EBDD; --body:#CFC5B2; --muted:#9A8F7A;
  --teal:#3EC6D2; --green:#7FB573; --red:#E07A5F; --gold:#D9B64A;
  --input:#332C24; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-theme="dark"] nav.pills button.active,[data-theme="dark"] .filter-tabs button.active,[data-theme="dark"] .seg button.active,[data-theme="dark"] .icon-opt.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="dark"] .dur-btn.sel{border-color:var(--accent);background:var(--accent);color:#fff}
[data-theme="dark"] .btn2:hover{background:#453D31}
[data-theme="dark"] .btn-danger{background:#4A2A22}
[data-theme="dark"] .btn-danger:hover{background:#5A322A}
[data-theme="dark"] .chip.must{background:#4A3A1A;color:#E8C95A}
[data-theme="dark"] .chip.done{background:#2C3D2A;color:#9CCB90}
[data-theme="dark"] .chip.energy{background:#362E25;color:#CFC5B2}
[data-theme="dark"] .idea-icon{background:#3A3550}
[data-theme="dark"] .heat .cell{background:#362E25}
[data-theme="dark"] .heat .cell.l1{background:#3A3550}
[data-theme="dark"] .heat .cell.l2{background:#4A4480}
[data-theme="dark"] .heat .cell.l3{background:#5A54A0}
[data-theme="dark"] .heat .cell.l4{background:#7A84C8}
[data-theme="dark"] .toast{background:var(--head);color:var(--bg)}
[data-theme="dark"] .footer .f-brand img{background:#FAF6EF;border-radius:10px;padding:8px 12px}
[data-theme="dark"] .bar-track{background:#453D31}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--body);font-family:'Inter Variable','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55;padding:0 20px 40px}
h1,h2,h3,.serif{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;color:var(--head);font-weight:600}
.wrap{max-width:1280px;margin:0 auto}
a{color:var(--accent-deep)}
/* Header */
header.top{display:flex;align-items:center;gap:20px;padding:22px 0 8px;flex-wrap:wrap}
.brand{background:none;border:none;text-align:left;cursor:pointer;font-family:inherit;padding:0;display:flex;align-items:center;gap:10px}
.brand .spark{width:34px;height:34px;flex:0 0 34px;color:var(--accent)}
.brand .b1{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.3rem;color:var(--head);font-weight:700;line-height:1.1}
.brand .b2{font-size:.68rem;letter-spacing:.22em;color:var(--muted);font-weight:600}
nav.pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.pills button{border:none;background:transparent;color:var(--body);padding:8px 13px;border-radius:999px;font-size:.9rem;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav.pills button svg{width:16px;height:16px;flex:0 0 16px}
nav.pills button:hover{background:var(--tint)}
nav.pills button.active{background:var(--accent-soft);color:var(--head);font-weight:600}
/* Views */
.view{display:none}
.view.active{display:block}
.view-head{padding:18px 0 14px}
.view-head .eyebrow{font-size:.72rem;letter-spacing:.24em;color:var(--muted);font-weight:700}
.view-head h1{font-size:2rem;margin:4px 0 2px}
.view-head p{color:var(--muted);max-width:640px}
.view-head .head-actions{float:right;display:flex;gap:8px;margin-top:6px}
@media(max-width:640px){.view-head .head-actions{float:none;margin:10px 0 0}}
/* Cards & grids */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:0 2px 10px var(--shadow);margin-bottom:16px}
.card h3{font-size:1.15rem;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:.9rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.main-rail{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:900px){.main-rail{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
/* Stats */
.stat{padding:14px 16px}
.stat .l{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:1.6rem;color:var(--head);font-weight:600;margin-top:2px}
.stat .s{font-size:.82rem;color:var(--muted)}
/* Buttons */
button{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-size:.93rem;font-weight:600;font-family:inherit}
.btn{background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn2{background:var(--card);color:var(--head);border:1px solid var(--border)}
.btn2:hover{background:var(--tint)}
.btn-dark{background:var(--head);color:var(--bg)}
.btn-danger{background:#FBE9E4;color:var(--red)}
.btn-danger:hover{background:#F6D8D0}
.btn-sm{padding:7px 12px;font-size:.85rem}
.btn-block{width:100%}
.iconbtn{background:transparent;border:none;color:var(--muted);padding:6px;border-radius:8px;font-size:1rem;line-height:1}
.iconbtn:hover{background:var(--tint);color:var(--head)}
.iconbtn svg{width:18px;height:18px;display:block}
.iconbtn.gold{color:var(--gold)}
.iconbtn.danger:hover{color:var(--red)}
.textbtn{background:none;border:none;color:var(--accent-deep);padding:4px 2px;font-size:.9rem;font-weight:600}
.textbtn:hover{text-decoration:underline}
.linkrow{display:block;text-align:center;padding:10px 0 2px;color:var(--accent-deep);font-weight:600;font-size:.92rem;text-decoration:none}
.linkrow:hover{text-decoration:underline}
/* Chips */
.chip{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tint);color:var(--muted);white-space:nowrap}
.chip.must{background:#FBF0C8;color:#8A6D1B}
.chip.done{background:#E3EFDF;color:#3F6B38}
.chip.energy{background:var(--accent-soft);color:var(--accent-deep)}
/* Inputs */
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--input);font-size:1rem;color:var(--body);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.fld{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;background:var(--card);border:1px solid var(--border);color:var(--body);padding:9px 8px;font-size:.88rem;white-space:nowrap}
.seg button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--head)}
.input-row{display:flex;gap:10px}
.input-row input{flex:1}
/* Filter pills */
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.filter-tabs button{background:var(--card);border:1px solid var(--border);color:var(--body);padding:8px 16px;border-radius:99px;font-size:.9rem}
.filter-tabs button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--head)}
.filter-tabs .n{opacity:.65;font-weight:500}
/* Task rows */
.task-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.task-row:last-child{border-bottom:none}
.task-row .t-main{flex:1;min-width:0}
.task-row .t-title{font-weight:600;color:var(--head);font-size:.98rem}
.task-row.done .t-title{text-decoration:line-through;color:var(--muted);font-weight:500}
.task-row .t-step{font-size:.86rem;color:var(--accent-deep)}
.task-row .t-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.task-row .t-actions{display:flex;gap:2px;flex:0 0 auto}
.circle-btn{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid var(--border);background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:transparent;font-size:.8rem}
.circle-btn:hover{border-color:var(--accent)}
.circle-btn.done{background:var(--green);border-color:var(--green);color:#fff}
/* Brain dump */
.dump-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border)}
.dump-row:last-child{border-bottom:none}
.dump-row .d-text{flex:1;min-width:0;color:var(--head);font-size:.98rem}
.dump-row .d-actions{display:flex;gap:2px;flex:0 0 auto;align-items:center}
.spark-ic{color:var(--accent);flex:0 0 auto}
.spark-ic svg{width:20px;height:20px;display:block}
/* Routines */
.prog{height:8px;background:var(--tint);border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-track{height:8px;background:var(--tint);border-radius:99px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.step-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px;color:var(--body);font-weight:500}
.step-btn:hover{border-color:var(--accent)}
.step-btn .dot{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:transparent}
.step-btn.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.step-btn.done{color:var(--muted)}
.step-btn.done span.st{text-decoration:line-through}
.streak-badge{display:inline-block;background:#FBF0C8;color:#8A6D1B;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px}
.card-foot{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
/* Focus */
.dur-row{display:flex;gap:10px;flex-wrap:wrap}
.dur-btn{flex:1;min-width:64px;background:var(--card);border:2px solid var(--border);color:var(--head);padding:14px 6px;font-size:1rem}
.dur-btn.sel{border-color:var(--accent);background:var(--accent-soft)}
.sprint-table{width:100%;border-collapse:collapse;font-size:.92rem}
.sprint-table th{text-align:left;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--border)}
.sprint-table td{padding:9px 6px;border-bottom:1px solid var(--border);color:var(--head)}
.sprint-table tr:last-child td{border-bottom:none}
/* Timer ring */
.timer-wrap{position:relative;width:210px;height:210px;margin:8px auto 4px}
.timer-wrap svg{transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:var(--tint);stroke-width:10}
.timer-ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif;font-size:2.6rem;color:var(--head);font-weight:600}
/* Dopamine */
.idea-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--border);cursor:pointer;background:transparent;border-left:none;border-right:none;border-top:none;border-radius:0;width:100%;text-align:left;font-family:inherit;color:var(--body)}
.idea-row:last-child{border-bottom:none}
.idea-row:hover{background:var(--tint)}
.idea-icon{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-deep)}
.idea-icon svg{width:20px;height:20px}
.idea-row .i-name{flex:1;font-weight:600;color:var(--head);font-size:.95rem}
.idea-row .i-min{color:var(--muted);font-size:.88rem;white-space:nowrap}
.add-idea-btn{width:100%;border:2px dashed var(--border);background:transparent;color:var(--muted);padding:12px;margin-top:10px}
.add-idea-btn:hover{border-color:var(--accent);color:var(--accent-deep)}
/* Wins */
.win-group{margin-bottom:14px}
.win-group .wg-date{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px}
.win-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.win-row:last-child{border-bottom:none}
.win-row .w-ic{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.win-row .w-ic.star{background:#FBF0C8;color:#B8932A}
.win-row .w-ic.check{background:#E3EFDF;color:#3F6B38}
.win-row .w-ic svg{width:16px;height:16px}
.win-row .w-text{flex:1;color:var(--head);font-size:.95rem}
/* Insights */
.chart-wrap{width:100%;overflow-x:auto}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat .cell{width:14px;height:14px;border-radius:3px;background:var(--tint)}
.heat .cell.l1{background:#D8DDF0}
.heat .cell.l2{background:#B4BDE4}
.heat .cell.l3{background:#8F99D3}
.heat .cell.l4{background:var(--accent)}
.heat-legend{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted);margin-top:8px}
.mile-chip{display:inline-block;background:var(--tint);color:var(--muted);border-radius:99px;padding:5px 12px;font-size:.83rem;font-weight:600;margin:0 6px 6px 0}
.mile-chip.earned{background:var(--accent-soft);color:var(--accent-deep)}
/* Settings */
.accent-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;max-width:420px}
.accent-dot{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.accent-dot.sel{border-color:var(--head);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--head)}
.sec-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.sec-row:last-child{border-bottom:none}
.sec-row input{flex:1}
.sec-row .n-ideas{color:var(--muted);font-size:.85rem;white-space:nowrap}
.drag-handle{color:var(--muted);cursor:grab;font-size:1.1rem;flex:0 0 auto}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--head)}
.switch input{display:none}
.switch .sl{width:46px;height:26px;border-radius:99px;background:var(--border);position:relative;transition:background .2s;flex:0 0 46px}
.switch .sl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl::after{left:23px}
[data-theme="dark"] .switch .sl{background:#4A4234}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:18px;padding:26px;max-width:520px;width:100%;margin:auto;position:relative;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.modal h2{font-size:1.4rem}
.modal .m-sub{color:var(--muted);font-size:.92rem;margin-top:4px}
.modal .m-close{position:absolute;top:12px;right:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.lock-ic{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.lock-ic svg{width:26px;height:26px}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icon-opt{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--body);padding:6px}
.icon-opt svg{width:22px;height:22px}
.icon-opt.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
/* Toast + footer */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--head);color:#FAF6EF;padding:12px 20px;border-radius:99px;font-size:.92rem;font-weight:600;z-index:100;transition:transform .3s,visibility 0s .3s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 40px);text-align:center;visibility:hidden;display:flex;gap:12px;align-items:center}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible;transition:transform .3s,visibility 0s}
.toast button{background:none;border:none;color:#FFD97A;font-weight:700;padding:0;font-size:.92rem}
.footer{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;padding:26px 10px 8px}
.footer .f-brand{margin-left:auto;text-align:right}
.footer .f-brand img{width:150px;height:auto;display:block;margin-left:auto}
.footer .f-copy{font-size:.78rem;margin-top:4px}
/* Demo banner (only shown when DEMO_MODE is true) */
.demo-banner{background:#2B2620;color:#FAF6EF;text-align:center;padding:10px 16px;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-left:-20px;margin-right:-20px}
.demo-banner em{font-family:'Fraunces Variable','Fraunces',Georgia,Cambria,serif}
.demo-banner a{background:#FAF6EF;color:#2B2620;padding:6px 14px;border-radius:99px;font-weight:700;text-decoration:none;font-size:.88rem;white-space:nowrap}
.demo-banner a:hover{background:#fff}
/* How-today mini card */
.how-card{background:var(--tint);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.88rem}
.how-card ol{margin:6px 0 0 18px}
.how-card li{margin:2px 0}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:.93rem}
.nudge-btns{display:flex;gap:8px;flex-wrap:wrap}
@media print{button,nav.pills,.no-print{display:none!important}body{background:#fff}.view{display:block!important}.card{box-shadow:none;break-inside:avoid}}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
body{padding:0 12px 32px}
header.top{flex-direction:column;align-items:flex-start;gap:10px}
nav.pills{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch}
nav.pills button{flex:0 0 auto}
.view-head h1{font-size:1.6rem}
.g2,.main-rail{grid-template-columns:1fr!important}
.stat .v{font-size:1.35rem}
.modal{padding:18px;margin:16px auto}
.demo-banner{margin-left:-12px;margin-right:-12px}
.overlay{padding:10px}
input,select,textarea{font-size:16px}
.icon-grid{grid-template-columns:repeat(6,1fr)}
.accent-grid{grid-template-columns:repeat(7,1fr)}
.task-row .t-actions{flex-wrap:wrap;justify-content:flex-end}
}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <button class="brand" onclick="go('today')" aria-label="Shop by Wrenly home">
    <span class="spark" id="brandSpark"></span>
    <span><span class="b1">Shop by Wrenly</span><br><span class="b2">ADHD COMMAND CENTER</span></span>
  </button>
  <nav class="pills" id="navPills"></nav>
</header>
<main>
  <section class="view" id="view-today"></section>
  <section class="view" id="view-brain-dump"></section>
  <section class="view" id="view-tasks"></section>
  <section class="view" id="view-routines"></section>
  <section class="view" id="view-focus"></section>
  <section class="view" id="view-dopamine"></section>
  <section class="view" id="view-wins"></section>
  <section class="view" id="view-insights"></section>
  <section class="view" id="view-settings"></section>
</main>
<footer class="footer">
  <div>

function accentHex(name){for(var i=0;i<ACCENTS.length;i++){if(ACCENTS[i].name===name)return ACCENTS[i].hex}return '#7A84C8'}
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function mixHex(h1,h2,f){var a=hexToRgb(h1),b=hexToRgb(h2);var r=a.map(function(v,i){return Math.round(v+(b[i]-v)*f)});return 'rgb('+r[0]+','+r[1]+','+r[2]+')'}

function somedayTasks(){return S.tasks.filter(function(t){return !t.done&&t.priority==='Someday'})}
function doneTasks(){return S.tasks.filter(function(t){return t.done})}
function focusToday(){var t=todayISO();return S.sprints.filter(function(s){return s.date===t}).reduce(function(a,s){return a+s.minutes},0)}
function focusAll(){return S.sprints.reduce(function(a,s){return a+s.minutes},0)}

function bestStreak(){var best=null;S.routines.forEach(function(r){if(!best||r.streak>best.streak)best=r});return best}

function toggleStep(rid,idx){
  if(demoBlocked())return;
  var r=S.routines.find(function(x){return x.id===rid});if(!r)return;
  r.doneToday[idx]=!r.doneToday[idx];
  var allDone=r.doneToday.every(Boolean);
  var t=todayISO();
  if(allDone&&r.lastDoneDate!==t){
    var y=daysAgo(1);
    r.streak=(r.lastDoneDate===y)?r.streak+1:1;
    r.lastDoneDate=t;
    toast('Routine complete! Streak: '+r.streak+' day'+(r.streak===1?'':'s')+'.');
  }else if(!allDone&&r.lastDoneDate===t){
    /* un-ticking after a full day: keep the streak, just mark today open again */
    r.lastDoneDate=null;
  }
  refresh();
}
function openRoutineDialog(id){
  var r=id?S.routines.find(function(x){return x.id===id}):null;
  openModal('<h2>'+(r?esc(r.name):'New routine')+'</h2><p class="m-sub">'+(r?'Change the name or the steps.':'A few steps, in order, at the same time each day.')+'</p>'
    +'<form onsubmit="return saveRoutine(event,\''+(r?r.id:'')+'\')">'
    +'<label class="fld">Name</label><input id="rf-name" required value="'+esc(r?r.name:'')+'" placeholder="e.g. Morning launch">'
    +'<label class="fld">Description</label><input id="rf-desc" value="'+esc(r?r.desc||'':'')+'" placeholder="What is this routine for?">'
    +'<label class="fld">Steps (one per line)</label><textarea id="rf-steps" rows="5" placeholder="Drink a glass of water&#10;Make the bed&#10;Get dressed&#10;Eat something">'+esc(r?r.steps.join('\n'):'')+'</textarea>'
    +'<div class="modal-actions"><button type="button" class="btn2" onclick="closeModal()">Cancel</button><button type="submit" class="btn">'+(r?'Save changes':'Add routine')+'</button></div></form>');
}
function saveRoutine(ev,id){
  ev.preventDefault();
  if(demoBlocked())return false;
  var name=document.getElementById('rf-name').value.trim();
  var steps=document.getElementById('rf-steps').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  if(!name||!steps.length){toast('Give the routine a name and at least one step.');return false}
  var desc=document.getElementById('rf-desc').value.trim();
  var r=id?S.routines.find(function(x){return x.id===id}):null;
  if(r){r.name=name;r.desc=desc;r.steps=steps;r.doneToday=steps.map(function(_,i){return !!r.doneToday[i]})}
  else{S.routines.push({id:uid(),name:name,desc:desc,steps:steps,doneToday:steps.map(function(){return false}),streak:0,lastDoneDate:null})}
  closeModal();refresh();toast(r?'Routine updated.':'Routine added.');
  return false;
}
function confirmDeleteRoutine(id){
  var r=S.routines.find(function(x){return x.id===id});if(!r)return;
  openModal('<h2>Delete this routine?</h2><p class="m-sub">\u201c'+esc(r.name)+'\u201d and its streak will be removed.</p><div class="modal-actions"><button class="btn2" onclick="closeModal()">Cancel</button><button class="btn-danger" onclick="deleteRoutine(\''+id+'\')">Delete</button></div>');
}
function deleteRoutine(id){
  if(demoBlocked())return;
  S.routines=S.routines.filter(function(x){return x.id!==id});
  closeModal();refresh();toast('Routine deleted.');
}

/* ---------- FOCUS + sprint timer ---------- */
var TIMER={running:false,endAt:0,total:0,label:'',taskId:null,interval:null};
function renderFocus(){

  var first6=nowTasks().slice(0,6);
  var focusRows=first6.length?first6.map(function(t){

  }).join(''):'<tr><td colspan="3" style="color:var(--muted);text-align:center;padding:18px">No sprints yet. Your first five minutes count.</td></tr>';

    +'<div class="card stat"><div class="l">All time</div><div class="v">'+fmtMins(focusAll())+'</div><div class="s">minutes focused</div></div>'
    +'<div class="card stat"><div class="l">Sprints</div><div class="v">'+S.sprints.length+'</div><div class="s">completed</div></div>'
    +'<div class="card stat"><div class="l">Default sprint</div><div class="v">'+S.settings.focusMinutes+' min</div><div class="s">change in Settings</div></div></div>'
    +'<div class="card"><h3>Start a sprint</h3><p class="sub">Pick a length and go. You can always add five more minutes.</p><div class="dur-row" style="margin-top:12px">'
    +durs.map(function(d){return '<button class="dur-btn'+(S.ui.focusDur===d?' sel':'')+'" onclick="setFocusDur('+d+')">'+d+'m</button>'}).join('')
    +'</div><button class="btn btn-block" style="margin-top:12px" onclick="openSprintDialog(null,null)">Start a '+S.ui.focusDur+'-minute sprint</button></div>'
    +'<div class="g2"><div class="card"><h3>Focus on a task</h3><p class="sub">The timer starts at the task\u2019s time guess.</p>'+focusRows+'</div>'
    +'<div class="card"><h3>Recent sprints</h3><table class="sprint-table"><tr><th>Task</th><th>Time</th><th>Date</th></tr>'+sprintRows+'</table></div></div>';
}
function setFocusDur(d){S.ui.focusDur=d;save();renderAll();openSprintDialog(null,null)}
function openSprintDialog(taskId,preset,overrideMins){
  var mins=S.ui.focusDur,label='';
  if(taskId){var t=S.tasks.find(function(x){return x.id===taskId});if(t){mins=Math.min(Math.max(t.timeMinutes||15,5),120);label=t.title}}
  if(preset){mins=preset.minutes;label=preset.label}
  if(overrideMins)mins=overrideMins;
  TIMER.label=label;TIMER.taskId=taskId||null;TIMER.total=mins*60;TIMER.running=false;TIMER.endAt=0;
  stopTimerInterval();
  renderSprintModal(mins*60,mins*60);
}
function renderSprintModal(remaining,total){
  var pct=total>0?remaining/total:0;
  var mm=Math.floor(remaining/60),ss=remaining%60;
  var timeStr=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  var C=2*Math.PI*95;
  openModal('<div style="text-align:center">'
    +(TIMER.label?'<div class="eyebrow" style="font-size:.72rem;letter-spacing:.24em;color:var(--muted);font-weight:700">'+esc(TIMER.label.toUpperCase())+'</div>':'')
    +'<h2 style="margin-top:4px">Focus sprint</h2><p class="m-sub">Ready when you are.</p>'
    +'<div class="timer-wrap"><svg width="210" height="210" viewBox="0 0 210 210"><circle class="timer-ring-bg" cx="105" cy="105" r="95"/><circle class="timer-ring-fg" id="timerRing" cx="105" cy="105" r="95" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg><div class="timer-num" id="timerNum">'+timeStr+'</div></div>'
    +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn2" onclick="timerAdd5()">+5 min</button><button class="btn" id="timerStartBtn" onclick="timerStart()">Start</button><button class="btn2" onclick="timerReset()">Reset</button></div>'
    +'<div style="margin-top:14px"><button class="textbtn" onclick="timerEndLog()">End &amp; log this sprint</button></div>'
    +'<p class="sub" style="margin-top:10px;font-size:.85rem">The timer keeps going if you switch tabs.</p>'
    +'<div style="margin-top:6px"><button class="textbtn" onclick="closeModal()">Close</button></div></div>');
}
function stopTimerInterval(){if(TIMER.interval){clearInterval(TIMER.interval);TIMER.interval=null}}
function timerTick(){
  var remaining=Math.max(0,Math.round((TIMER.endAt-Date.now())/1000));
  var num=document.getElementById('timerNum'),ring=document.getElementById('timerRing');
  if(num){var mm=Math.floor(remaining/60),ss=remaining%60;num.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss}
  if(ring){var C=2*Math.PI*95;ring.style.strokeDashoffset=C*(1-(TIMER.total>0?remaining/TIMER.total:0))}
  if(remaining<=0){
    stopTimerInterval();TIMER.running=false;
    var b=document.getElementById('timerStartBtn');if(b)b.textContent='Start';
    toast('Time\u2019s up \u2014 nice work. Log it or take a break.');
  }
}
function timerStart(){
  if(TIMER.running)return;
  TIMER.running=true;TIMER.endAt=Date.now()+TIMER.total*1000;
  var b=document.getElementById('timerStartBtn');if(b)b.textContent='Running\u2026';
  stopTimerInterval();
  TIMER.interval=setInterval(timerTick,500);
  timerTick();
}
function timerAdd5(){
  TIMER.total+=300;
  if(TIMER.running)TIMER.endAt+=300000;
  var remaining=TIMER.running?Math.max(0,Math.round((TIMER.endAt-Date.now())/1000)):TIMER.total;
  var num=document.getElementById('timerNum'),ring=document.getElementById('timerRing');
  if(num){var mm=Math.floor(remaining/60),ss=remaining%60;num.textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss}
  if(ring){var C=2*Math.PI*95;ring.style.strokeDashoffset=C*(1-(TIMER.total>0?remaining/TIMER.total:0))}
  toast('Five more minutes added.');
}
function timerReset(){
  stopTimerInterval();TIMER.running=false;
  renderSprintModal(TIMER.total,TIMER.total);
}
function timerEndLog(){
  if(demoBlocked())return;
  var spent=TIMER.total;
  if(TIMER.running){spent=Math.max(0,Math.round((TIMER.endAt-Date.now())/1000));spent=TIMER.total-spent}
  stopTimerInterval();TIMER.running=false;
  var mins=Math.max(1,Math.round(spent/60));
  S.sprints.push({id:uid(),label:TIMER.label||'Open sprint',minutes:mins,date:todayISO()});
  if(TIMER.taskId){var tk=S.tasks.find(function(x){return x.id===TIMER.taskId});if(tk){tk.actualMinutes=(tk.actualMinutes||0)+mins}}
  closeModal();refresh();toast('Sprint logged: '+mins+' minutes of focus.');
}

function addWin(){
  var v=document.getElementById('winInput').value.trim();
  if(!v)return;
  if(demoBlocked())return;
  S.wins.push({id:uid(),text:v,date:todayISO(),source:'free'});
  refresh();toast('Win saved. Nicely done.');
}
function confirmDeleteWin(id){
  var w=S.wins.find(function(x){return x.id===id});if(!w)return;
  openModal('<h2>Remove this win?</h2><p class="m-sub">\u201c'+esc(w.text)+'\u201d will be removed. Changed your mind? You can undo it from the message that pops up.</p><div class="modal-actions"><button class="btn2" onclick="closeModal()">Cancel</button><button class="btn-danger" onclick="deleteWin(\''+id+'\')">Remove</button></div>');
}
function deleteWin(id){
  if(demoBlocked())return;
  var w=S.wins.find(function(x){return x.id===id});if(!w)return;
  var idx=S.wins.indexOf(w);
  S.wins.splice(idx,1);
  closeModal();refresh();
  toast('Win removed.',function(){S.wins.splice(Math.min(idx,S.wins.length),0,w);refresh();toast('Win restored.')});
}

var MILESTONES=[
{id:'m1',name:'First Thought Out',test:function(){return S.thoughts.length>=1}},
{id:'m2',name:'First Done',test:function(){return doneTasks().length>=1}},
{id:'m3',name:'First Focus',test:function(){return S.sprints.length>=1}},
{id:'m4',name:'Warming Up',test:function(){return doneTasks().length>=5}},
{id:'m5',name:'In the Zone',test:function(){return focusAll()>=60}},
{id:'m6',name:'Deep Worker',test:function(){return focusAll()>=300}},
{id:'m7',name:'Win Collector',test:function(){return S.wins.length>=10}},
{id:'m8',name:'Three-Day Rhythm',test:function(){return S.routines.some(function(r){return r.streak>=3})}},
{id:'m9',name:'Week of Showing Up',test:function(){return S.routines.some(function(r){return r.streak>=7})}},
{id:'m10',name:'Ten Tasks Down',test:function(){return doneTasks().length>=10}},
{id:'m11',name:'Focus Regular',test:function(){return S.sprints.length>=10}},
{id:'m12',name:'Twenty Wins',test:function(){return S.wins.length>=20}}
];
function milestoneProgress(m){
  if(m.id==='m1')return {cur:S.thoughts.length,goal:1};
  if(m.id==='m2')return {cur:doneTasks().length,goal:1};
  if(m.id==='m3')return {cur:S.sprints.length,goal:1};
  if(m.id==='m4')return {cur:doneTasks().length,goal:5};
  if(m.id==='m5')return {cur:focusAll(),goal:60};
  if(m.id==='m6')return {cur:focusAll(),goal:300};
  if(m.id==='m7')return {cur:S.wins.length,goal:10};
  if(m.id==='m8')return {cur:Math.max.apply(null,S.routines.map(function(r){return r.streak}).concat([0])),goal:3};
  if(m.id==='m9')return {cur:Math.max.apply(null,S.routines.map(function(r){return r.streak}).concat([0])),goal:7};
  if(m.id==='m10')return {cur:doneTasks().length,goal:10};
  if(m.id==='m11')return {cur:S.sprints.length,goal:10};
  return {cur:S.wins.length,goal:20};
}
function renderInsights(){
  var el=document.getElementById('view-insights');
  var range=S.ui.insightsRange;
  var days=range==='7D'?7:range==='1M'?30:range==='3M'?90:range==='6M'?180:365;
  /* focus per day over range */
  var perDay={};
  for(var i=days-1;i>=0;i--){perDay[daysAgo(i)]=0}
  S.sprints.forEach(function(s){if(perDay[s.date]!==undefined)perDay[s.date]+=s.minutes});
  var vals=Object.keys(perDay).sort().map(function(d){return perDay[d]});
  var max=Math.max.apply(null,vals.concat([10]));
  var avg=vals.reduce(function(a,b){return a+b},0)/Math.max(vals.length,1);
  var W=640,H=180,pad=10;
  var pts=vals.map(function(v,i){var x=pad+(W-2*pad)*(vals.length>1?i/(vals.length-1):0);var y=H-pad-(H-2*pad)*(v/max);return [x,y]});
  var line=pts.map(function(p,i){return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var area=line+' L'+pts[pts.length-1][0].toFixed(1)+','+(H-pad)+' L'+pts[0][0].toFixed(1)+','+(H-pad)+' Z';
  var avgY=H-pad-(H-2*pad)*(avg/max);
  var chart='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block"><path d="'+area+'" fill="var(--accent-soft)" opacity="0.7"/><path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><line x1="'+pad+'" y1="'+avgY.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+avgY.toFixed(1)+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-pad-4)+'" y="'+(avgY-6).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">avg '+Math.round(avg)+' min/day</text></svg>';
  /* heatmap ~6 months of wins */
  var winPerDay={};
  S.wins.forEach(function(w){winPerDay[w.date]=(winPerDay[w.date]||0)+1});
  var cells='';
  for(var d=179;d>=0;d--){
    var date=daysAgo(d),n=winPerDay[date]||0;
    var lvl=n===0?0:n===1?1:n===2?2:n<=4?3:4;
    cells+='<div class="cell'+(lvl?' l'+lvl:'')+'" title="'+date+': '+n+' win'+(n===1?'':'s')+'"></div>';
  }
  /* time guess vs reality */
  var finished=S.tasks.filter(function(t){return t.done&&t.actualMinutes});
  var timeHTML='';
  if(finished.length){
    var g=finished.reduce(function(a,t){return a+t.timeMinutes},0)/finished.length;
    var a=finished.reduce(function(a,t){return a+t.actualMinutes},0)/finished.length;
    var pct=g>0?Math.round((a-g)/g*100):0;
    timeHTML='<p style="color:var(--head);font-size:1.05rem">You usually guess <strong>'+Math.round(g)+'m</strong>, but tasks really take <strong>'+Math.round(a)+'m</strong> \u2014 that\u2019s <strong>'+pct+'% longer</strong> than you think. Across '+finished.length+' finished task'+(finished.length===1?'':'s')+'.</p><p class="sub" style="margin-top:6px">Nothing wrong with you \u2014 almost everyone guesses short. Next time, add a little buffer and call it a win.</p>';
  }else{
    timeHTML='<p class="sub">Finish a few timed tasks and this page will learn how your guesses compare with reality.</p>';
  }
  /* routine streaks */
  var streakRows=S.routines.filter(function(r){return r.streak>0});
  var streakHTML=streakRows.length?streakRows.map(function(r){return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span style="color:var(--head);font-weight:600">'+esc(r.name)+'</span><span class="streak-badge">\uD83D\uDD25 '+r.streak+' days</span></div>'}).join(''):'<p class="sub">No streaks yet. Finish a routine today and one starts here.</p>';
  /* milestones */
  var earned=MILESTONES.filter(function(m){return m.test()});
  var next=MILESTONES.find(function(m){return !m.test()});
  var nextHTML='';
  if(next){
    var p=milestoneProgress(next);
    var pct2=Math.min(100,Math.round(p.cur/p.goal*100));
    nextHTML='<p style="margin-bottom:6px"><strong style="color:var(--head)">Next: '+esc(next.name)+'</strong> \u2014 '+p.cur+' of '+p.goal+'</p><div class="bar-track"><i style="width:'+pct2+'%"></i></div>';
  }else{
    nextHTML='<p style="color:var(--head);font-weight:600">Every milestone earned. That is no small thing.</p>';
  }
  var chipsHTML=MILESTONES.map(function(m){return '<span class="mile-chip'+(m.test()?' earned':'')+'">'+(m.test()?'\u2713 ':'')+esc(m.name)+'</span>'}).join('');
  var ranges=['7D','1M','3M','6M','12M'];
  el.innerHTML=headHTML('WHAT ACTUALLY HAPPENED','Insights','No judgement here \u2014 just what your days really looked like.')
    +'<div class="g4">'
    +'<div class="card stat"><div class="l">Tasks done</div><div class="v">'+doneTasks().length+'</div><div class="s">'+S.tasks.filter(function(x){return x.done&&x.doneDate===todayISO()}).length+' today</div></div>'
    +'<div class="card stat"><div class="l">Focused time</div><div class="v">'+fmtMins(focusAll())+'</div><div class="s">'+S.sprints.length+' sprints</div></div>'
    +'<div class="card stat"><div class="l">Wins</div><div class="v">'+S.wins.length+'</div><div class="s">'+winsToday()+' today</div></div>'
    +'<div class="card stat"><div class="l">Longest streak</div><div class="v">'+(bestStreak()?bestStreak().streak:0)+' days</div><div class="s">'+(bestStreak()?esc(bestStreak().name):'No routine yet')+'</div></div></div>'
    +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>How steady is your focus?</h3><div class="filter-tabs" style="margin:0">'
    +ranges.map(function(r){return '<button class="'+(range===r?'active':'')+'" onclick="setInsightsRange(\''+r+'\')">'+r+'</button>'}).join('')
    +'</div></div><p class="sub">Minutes focused per day, with your daily average.</p><div class="chart-wrap" style="margin-top:12px">'+chart+'</div></div>'
    +'<div class="g2"><div class="card"><h3>How many days did you show up?</h3><p class="sub">Each square is a day. Darker means more wins.</p><div class="heat" style="margin-top:12px">'+cells+'</div><div class="heat-legend"><span>Less</span><span class="cell" style="display:inline-block;width:12px;height:12px;background:var(--tint);border-radius:3px"></span><span class="cell" style="display:inline-block;width:12px;height:12px;background:#B4BDE4;border-radius:3px"></span><span class="cell" style="display:inline-block;width:12px;height:12px;background:var(--accent);border-radius:3px"></span><span>More</span></div></div>'
    +'<div class="card"><h3>Time, honestly</h3>'+timeHTML+'</div></div>'
    +'<div class="g2"><div class="card"><h3>Routine streaks</h3>'+streakHTML+'</div>'
    +'<div class="card"><h3>Milestones</h3><p class="sub">'+earned.length+' of 12 earned</p><div style="margin:12px 0">'+nextHTML+'</div><div>'+chipsHTML+'</div></div></div>';
}
function setInsightsRange(r){S.ui.insightsRange=r;save();renderAll()}

/* ---------- SETTINGS ---------- */
function renderSettings(){
  var el=document.getElementById('view-settings');
  var st=S.settings;
  var accentGrid=ACCENTS.map(function(a){return '<button class="accent-dot'+(st.accent===a.name?' sel':'')+'" style="background:'+a.hex+'" title="'+a.name+'" aria-label="'+a.name+'" onclick="setAccent(\''+a.name+'\')"></button>'}).join('');
  var secs=S.sections.slice().sort(function(a,b){return a.order-b.order});
  var secRows=secs.map(function(sec,i){
    var n=S.ideas.filter(function(x){return x.sectionId===sec.id}).length;
    return '<div class="sec-row"><span class="drag-handle" title="Drag to reorder (use the arrows)">\u2630</span>'
      +'<input value="'+esc(sec.name)+'" onchange="renameSection(\''+sec.id+'\',this.value)" aria-label="Section name">'
      +'<span class="n-ideas">'+n+' idea'+(n===1?'':'s')+'</span>'
      +'<button class="iconbtn" onclick="moveSection(\''+sec.id+'\',-1)" aria-label="Move up" '+(i===0?'disabled style="opacity:.3"':'')+'>\u2191</button>'
      +'<button class="iconbtn" onclick="moveSection(\''+sec.id+'\',1)" aria-label="Move down" '+(i===secs.length-1?'disabled style="opacity:.3"':'')+'>\u2193</button>'
      +'<button class="iconbtn danger" onclick="confirmDeleteSection(\''+sec.id+'\')" aria-label="Delete section">'+ic('trash')+'</button></div>';
  }).join('');
  var storageKB=0;
  try{storageKB=Math.round(((localStorage.getItem(KEY)||'').length*2)/102.4)/10}catch(e){}
  var openOpts=VIEWS.map(function(v){return '<option value="'+v.id+'"'+(st.openTo===v.id?' selected':'')+'>'+v.label+'</option>'}).join('');
  el.innerHTML=headHTML('MAKE IT YOURS','Settings','Set it up once, then forget about it. The planner bends to you, not the other way round.')
    +'<div class="card"><h3>Appearance</h3><p class="sub">Pick a look that feels calm to you.</p>'
    +'<label class="fld">Theme</label><div class="seg">'+['Auto','Light','Dark'].map(function(t){var v=t.toLowerCase();return '<button type="button" class="'+(st.theme===v?'active':'')+'" onclick="setTheme(\''+v+'\')">'+t+'</button>'}).join('')+'</div>'
    +'<p class="sub" style="margin-top:8px">Auto follows your device\u2019s light/dark setting.</p>'
    +'<label class="fld">Accent colour</label><div class="accent-grid">'+accentGrid+'</div><p class="sub" style="margin-top:8px">Now using: <strong style="color:var(--head)">'+esc(st.accent)+'</strong></p></div>'
    +'<div class="card"><h3>Day-to-day</h3><p class="sub">The small defaults that shape your day.</p>'
    +'<label class="fld">Open to</label><select onchange="setOpenTo(this.value)">'+openOpts+'</select>'
    +'<div class="g2" style="margin-top:4px"><div><label class="fld">Focus time (minutes)</label><input type="number" min="1" max="120" value="'+st.focusMinutes+'" onchange="setNumSetting(\'focusMinutes\',this.value)"></div>'
    +'<div><label class="fld">Take a break for (minutes)</label><input type="number" min="1" max="60" value="'+st.breakMinutes+'" onchange="setNumSetting(\'breakMinutes\',this.value)"></div></div>'
    +'<div style="margin-top:16px"><label class="switch"><input type="checkbox" '+(st.nudges?'checked':'')+' onchange="setNudges(this.checked)"><span class="sl"></span>Gentle nudges</label><p class="sub" style="margin-top:4px">Shows the small reset buttons on Today.</p></div>'
    +'<label class="fld">Water goal (glasses per day)</label><input type="number" min="1" max="20" value="'+st.waterGoal+'" onchange="setNumSetting(\'waterGoal\',this.value)" style="max-width:160px"></div>'
    +'<div class="card"><h3>Dopamine menu</h3><p class="sub">Rename sections, reorder them, or add your own. The order here is the order on the Dopamine screen.</p>'
    +secRows+'<button class="btn2 btn-sm" style="margin-top:12px" onclick="addSection()">+ Add section</button></div>'
    +'<div class="card"><h3>Backup &amp; data</h3><p class="sub">Everything lives on your device only \u2014 nothing is sent anywhere. Export a backup now and then, just in case.</p>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn2" onclick="exportJSON()">Export (.json)</button><button class="btn2" onclick="importClick()">Import</button></div>'
    +'<p class="sub" style="margin-top:12px">For spreadsheets:</p>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px"><button class="btn2 btn-sm" onclick="exportCSV(\'tasks\')">Export tasks (.csv)</button><button class="btn2 btn-sm" onclick="exportCSV(\'sprints\')">Export sprints (.csv)</button><button class="btn2 btn-sm" onclick="exportCSV(\'wins\')">Export wins (.csv)</button></div>'
    +'<p class="sub" style="margin-top:12px">Last backup: '+(st.lastBackup?fmtDate(st.lastBackup):'never')+' &middot; Storage used: '+storageKB+' KB</p>'
    +'<div style="margin-top:14px"><button class="btn2" onclick="loadSamples()">Load samples</button><p class="sub" style="margin-top:6px">Fills the planner with example tasks, wins and sprints so you can try everything.</p></div>'
    +'<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px"><button class="textbtn" style="color:var(--red)" onclick="confirmClearAll()">Clear all data</button><p class="sub" style="margin-top:4px">This erases everything in this planner \u2014 tasks, wins, routines, the lot. Export a backup first if you want to keep anything.</p></div></div>'
    +'<div class="card" style="text-align:center"><p class="sub">Version 1.0 &middot; Works 100% offline</p><p style="margin-top:6px"><a href="'+BUY_URL+'" target="_blank" rel="noopener">View on Etsy</a></p></div>';
}
function setTheme(v){
  if(DEMO_MODE){/* view control: session-only */S.settings.theme=v;applyTheme();renderAll();return}
  S.settings.theme=v;refresh();
}
function setAccent(name){
  if(DEMO_MODE){S.settings.accent=name;applyAccent();renderAll();return}
  S.settings.accent=name;refresh();
}
function setOpenTo(v){if(demoBlocked())return;S.settings.openTo=v;refresh()}
function setNumSetting(k,v){if(demoBlocked())return;var n=parseInt(v,10);if(!isNaN(n)&&n>0){S.settings[k]=n;refresh()}}
function setNudges(on){if(demoBlocked())return;S.settings.nudges=on;refresh()}
function renameSection(id,name){
  if(demoBlocked()){renderAll();return}
  var s=S.sections.find(function(x){return x.id===id});if(!s)return;
  name=name.trim();if(!name){renderAll();return}
  s.name=name;refresh();
}
function moveSection(id,dir){
  if(demoBlocked())return;
  var secs=S.sections.slice().sort(function(a,b){return a.order-b.order});
  var i=secs.findIndex(function(x){return x.id===id});
  var j=i+dir;if(j<0||j>=secs.length)return;
  var tmp=secs[i].order;secs[i].order=secs[j].order;secs[j].order=tmp;
  refresh();
}
function addSection(){
  if(demoBlocked())return;
  var max=S.sections.reduce(function(a,s){return Math.max(a,s.order)},-1);
  S.sections.push({id:uid(),name:'New section',order:max+1});
  refresh();toast('Section added \u2014 rename it to make it yours.');
}
function confirmDeleteSection(id){
  var s=S.sections.find(function(x){return x.id===id});if(!s)return;
  var n=S.ideas.filter(function(x){return x.sectionId===id}).length;
  openModal('<h2>Delete this section?</h2><p class="m-sub">\u201c'+esc(s.name)+'\u201d and its '+n+' idea'+(n===1?'':'s')+' will be removed.</p><div class="modal-actions"><button class="btn2" onclick="closeModal()">Cancel</button><button class="btn-danger" onclick="deleteSection(\''+id+'\')">Delete</button></div>');
}
function deleteSection(id){
  if(demoBlocked())return;
  S.sections=S.sections.filter(function(x){return x.id!==id});
  S.ideas=S.ideas.filter(function(x){return x.sectionId!==id});
  S.sections.slice().sort(function(a,b){return a.order-b.order}).forEach(function(s,i){s.order=i});
  closeModal();refresh();toast('Section deleted.');
}
function exportJSON(){
  var data=JSON.parse(JSON.stringify(S));delete data.ui;
  downloadFile('adhd-command-center-backup.json',JSON.stringify(data,null,2),'application/json');
  if(!DEMO_MODE){S.settings.lastBackup=todayISO();refresh()}
  toast('Backup downloaded.');
}
function importClick(){if(demoBlocked())return;document.getElementById('importFile').click()}
function importJSON(ev){
  var f=ev.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!data||typeof data!=='object'||!Array.isArray(data.tasks))throw new Error('bad file');
      var keepUI=S.ui;
      S=Object.assign(defaultState(),data);S.ui=keepUI;
      refresh();toast('Backup imported.');
    }catch(e){toast('That file does not look like a planner backup.')}
    ev.target.value='';
  };
  reader.readAsText(f);
}
function exportCSV(kind){
  var rows=[];
  if(kind==='tasks'){
    rows.push(['Title','First step','Priority','Energy','Time guess (min)','Done','Done date','Notes'].map(csvCell).join(','));
    S.tasks.forEach(function(t){rows.push([t.title,t.firstStep,t.priority,t.energy,t.timeMinutes,t.done?'Yes':'No',t.doneDate||'',t.notes].map(csvCell).join(','))});
  }else if(kind==='sprints'){
    rows.push(['Label','Minutes','Date'].map(csvCell).join(','));
    S.sprints.forEach(function(s){rows.push([s.label,s.minutes,s.date].map(csvCell).join(','))});
  }else{
    rows.push(['Win','Date','Source'].map(csvCell).join(','));
    S.wins.forEach(function(w){rows.push([w.text,w.date,w.source].map(csvCell).join(','))});
  }
  downloadFile('adhd-'+kind+'.csv',rows.join('\n'),'text/csv');
  toast('CSV downloaded.');
}
function loadSamples(){
  if(demoBlocked())return;
  var sample=sampleState();
  var keepSettings=S.settings,keepUI=S.ui;
  S=sample;S.settings=keepSettings;S.ui=keepUI;
  refresh();toast('Sample data loaded. Have a poke around.');
}
function confirmClearAll(){
  openModal('<h2>Clear all data?</h2><p class="m-sub">Everything in this planner will be erased \u2014 tasks, thoughts, wins, sprints and routines. This cannot be undone.</p><div class="modal-actions"><button class="btn2" onclick="closeModal()">Cancel</button><button class="btn-danger" onclick="clearAll()">Clear everything</button></div>');
}
function clearAll(){
  if(demoBlocked())return;
  var keepSettings=S.settings;
  localStorage.removeItem(KEY);
  S=defaultState();S.settings=keepSettings;
  closeModal();refresh();toast('All data cleared. Fresh start.');
}

/* ---------- Render map + init ---------- */
var RENDER={today:renderToday,'brain-dump':renderBrainDump,tasks:renderTasks,routines:renderRoutines,focus:renderFocus,dopamine:renderDopamine,wins:renderWins,insights:renderInsights,settings:renderSettings};
function routeFromHash(){
  var h=location.hash.replace('#/','');
  if(VIEWS.some(function(v){return v.id===h})){S.ui.view=h;save()}
}
load();
if(!DEMO_MODE&&!location.hash){S.ui.view=S.settings.openTo||'today'}
routeFromHash();
if(DEMO_MODE){document.body.insertAdjacentHTML('afterbegin','<div class="demo-banner"><em>You\u2019re exploring a live demo, changes won\u2019t be saved.</em><a href="'+BUY_URL+'" target="_blank" rel="noopener">Get the full planner</a></div>')}
window.addEventListener('hashchange',function(){routeFromHash();renderAll()});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.settings.theme==='auto')applyTheme()});
renderAll();
</script>
</body>
</html>
